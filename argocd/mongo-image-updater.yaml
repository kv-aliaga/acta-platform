apiVersion: argocd-image-updater.argoproj.io/v1alpha1
kind: ImageUpdater
metadata:
  name: acta-mongo-api
  namespace: argocd
spec:
  applicationRefs:
    - namePattern: acta-prod
      images:
        - alias: mongo-api
          imageName: ghcr.io/kv-aliaga/acta-mongo-api:sha-5c599cdc092a3c99026e41945cfa553ca3799588
          manifestTargets:
            kustomize:
              name: ghcr.io/appacta/acta-mongo-api
          commonUpdateSettings:
            updateStrategy: newest-build
            forceUpdate: true
            allowTags: 'regexp:^sha-[0-9a-f]{40}$'
